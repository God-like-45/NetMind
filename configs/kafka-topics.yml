# Kafka topic configuration (used by Phase 2 init script)
# Topics are not auto-created; they must be explicitly initialized.

topics:
  - name: netmind.telemetry
    partitions: 1        # 12 in production
    replication_factor: 1  # 3 in production
    config:
      retention.ms: 86400000   # 24 hours (local dev)
      cleanup.policy: delete

  - name: netmind.alarms
    partitions: 1
    replication_factor: 1
    config:
      retention.ms: 259200000   # 72 hours

  - name: netmind.topology
    partitions: 1
    replication_factor: 1
    config:
      retention.ms: 604800000   # 7 days

  - name: netmind.config_changes
    partitions: 1
    replication_factor: 1
    config:
      retention.ms: 2592000000   # 30 days

  - name: netmind.anomalies
    partitions: 1
    replication_factor: 1
    config:
      retention.ms: 604800000   # 7 days

  - name: netmind.incidents
    partitions: 1
    replication_factor: 1
    config:
      retention.ms: 2592000000   # 30 days
