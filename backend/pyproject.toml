[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netmind-backend"
version = "0.1.0"
description = "NETMIND - Autonomous Telecom Network Intelligence and Incident Resolution Platform"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}

dependencies = [
    # ─── Web Framework ────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",

    # ─── Data Validation ─────────────────────────────────────────────────────
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.0.0",

    # ─── Database ────────────────────────────────────────────────────────────
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",

    # ─── Redis ───────────────────────────────────────────────────────────────
    "redis>=5.1.0",

    # ─── Kafka ───────────────────────────────────────────────────────────────
    "aiokafka>=0.11.0",

    # ─── Security ────────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.12",

    # ─── Logging ─────────────────────────────────────────────────────────────
    "structlog>=24.4.0",

    # ─── Utilities ───────────────────────────────────────────────────────────
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
    "langgraph>=0.2.0",
    "langchain-ollama>=0.2.0",
]

[project.optional-dependencies]
ml = [
    # ─── Core ML (Phase 2+) ──────────────────────────────────────────────────
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    # "torch>=2.4.0", # Removed for now since it's massive and DL is later

    # ─── MLflow ──────────────────────────────────────────────────────────────
    "mlflow>=2.16.0",
    "dvc>=3.55.0",
]

graph = [
    # ─── Graph ML (Phase 3+) ─────────────────────────────────────────────────
    "networkx>=3.3.0",
    "torch-geometric>=2.6.0",
    "node2vec>=0.4.6",
]

rag = [
    # ─── RAG / Embeddings (Phase 5+) ─────────────────────────────────────────
    "llama-index>=0.11.0",
    "sentence-transformers>=3.1.0",
    "pgvector>=0.3.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.11.0",
    "llama-index-vector-stores-qdrant>=0.2.0",
    "llama-index-embeddings-huggingface>=0.3.0",
]

agent = [
    # ─── Agent (Phase 6+) ────────────────────────────────────────────────────
    "langgraph>=0.2.0",
    "langchain-ollama>=0.2.0",
]

dev = [
    # ─── Testing ─────────────────────────────────────────────────────────────
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgresql,kafka,redis]>=4.8.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=30.0.0",

    # ─── Linting / Formatting ────────────────────────────────────────────────
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=4.0.0",

    # ─── Type stubs ──────────────────────────────────────────────────────────
    "types-redis>=4.6.0",
    "types-passlib>=1.7.7",
    "types-python-jose>=3.3.4",
]

[tool.hatch.build.targets.wheel]
packages = ["netmind"]

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["netmind", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "RUF",  # ruff-specific
]
ignore = [
    "ANN101",   # Missing type annotation for `self`
    "ANN102",   # Missing type annotation for `cls`
    "S101",     # Use of assert (OK in tests)
    "B008",     # Do not perform function calls in argument defaults (FastAPI dependency pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "T20"]
"netmind/db/migrations/*" = ["ANN", "N999"]

# ─── Mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["netmind/db/migrations/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ─── Pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=netmind",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=65",
    "-v",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ─── Coverage ────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["netmind"]
omit = [
    "netmind/db/migrations/*",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
